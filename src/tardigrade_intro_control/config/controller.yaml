move_to_pose_server:
  ros__parameters:
    use_sim_time: true
    odometry_topic: /tardigrade/state/odometry/filtered
    command_topic: /tardigrade/control/velocity_setpoint/mission
    odometry_timeout_sec: 0.4
    control_rate_hz: 20.0
    feedback_rate_hz: 5.0
    settle_time_sec: 1.0
    position_kp: 0.45
    depth_kp: 0.6
    yaw_pid.kp: 0.8
    yaw_pid.ki: 0.0
    yaw_pid.kd: 0.0
    yaw_pid.integral_limit: 0.5
    yaw_pid.output_limit: 0.3
    yaw_pid.derivative_filter_alpha: 0.2
    max_linear: 0.35
    max_vertical: 0.25
    position_tolerance: 0.12
    depth_tolerance: 0.08
    yaw_tolerance: 0.08
